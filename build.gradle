plugins {
    id 'java'
}

group = 'ru.netology'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'com.codeborne:selenide:6.19.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'commons-dbutils:commons-dbutils:1.8.1'
    testImplementation 'com.mysql:mysql-connector-j:8.0.33'
    testImplementation 'org.slf4j:slf4j-simple:2.0.3'
}

test {
    useJUnitPlatform()

    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'chromeoptions.prefs',
            System.getProperty('chromeoptions.prefs', "profile.password_manager_leak_detection=false")
    systemProperty 'selenide.remote',
            System.getProperty('selenide.remote', 'http://localhost:4444')
    systemProperty 'selenide.baseUrl',
            System.getProperty('selenide.baseUrl', 'http://host.docker.internal:9999')

    if (System.getProperty('selenide.headless') != null) {
        systemProperty 'selenide.headless', System.getProperty('selenide.headless')
    }
}
